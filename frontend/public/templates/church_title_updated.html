<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>நல்ல சமாரியன் இயேசு ஜெப வீடு</title><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;600;700;900&family=Playfair+Display:ital,wght@1,400;0,700;0,900&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000}:root{--gold:#d4a843;--gold-light:#f0cc70;--cream:#fdf6e3;--amber:#c47a1e;--deep:#1a0a00;--warm-dark:#120800;}.stage{width:100vw;height:100vh;position:relative;overflow:hidden;background:var(--warm-dark);}/* ── LAYERED CANVASES ── */canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}#cFlame{z-index:1}#cDust{z-index:3}/* ── VIGNETTE ── */.vignette{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse 85% 85% at 50% 50%,transparent 30%,rgba(10,4,0,.4) 60%,rgba(5,2,0,.85) 100%);pointer-events:none;}/* ── ORNAMENTAL FRAME ── */.frame{position:absolute;inset:3vmin;z-index:6;border:1px solid rgba(212,168,67,.25);pointer-events:none;}.frame::before{content:'';position:absolute;inset:6px;border:1px solid rgba(212,168,67,.12);}/* corner ornaments */.frame-corner{position:absolute;width:60px;height:60px;z-index:7;pointer-events:none;opacity:0;animation:fadeIn 1s ease forwards;}.frame-corner svg{fill:none;stroke:var(--gold);stroke-width:1.2;opacity:.7}.fc-tl{top:3vmin;left:3vmin;animation-delay:.8s}.fc-tr{top:3vmin;right:3vmin;transform:scaleX(-1);animation-delay:1s}.fc-bl{bottom:3vmin;left:3vmin;transform:scaleY(-1);animation-delay:1.2s}.fc-br{bottom:3vmin;right:3vmin;transform:scale(-1,-1);animation-delay:1.4s}/* ── CONTENT CENTER ── */.content{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;}/* ── HALO RING ── */.halo{position:relative;margin-bottom:2.5vh;opacity:0;animation:haloIn 1.5s cubic-bezier(.2,1,.4,1) forwards .2s;}@keyframes haloIn{0%{opacity:0;transform:scale(.5);filter:blur(30px)}60%{opacity:1;filter:blur(2px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}.halo-ring{width:clamp(115px,13.5vw,190px);height:clamp(115px,13.5vw,190px);border-radius:50%;border:1px solid rgba(212,168,67,.3);display:flex;align-items:center;justify-content:center;position:relative;animation:rotateSlow 20s linear infinite;}@keyframes rotateSlow{to{transform:rotate(360deg)}}.halo-ring::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid transparent;border-top-color:var(--gold);border-right-color:rgba(212,168,67,.4);animation:rotateFast 4s linear infinite;}@keyframes rotateFast{to{transform:rotate(-360deg)}}.halo-ring::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(212,168,67,.15);border-bottom-color:rgba(212,168,67,.6);animation:rotateFast 7s linear infinite reverse;}.cross-symbol{font-size:clamp(52px,7vw,92px);line-height:1;animation:rotateSlow 20s linear infinite reverse;background:linear-gradient(170deg,#fff8e7 0%,var(--gold-light) 40%,var(--gold) 70%,var(--amber) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 14px rgba(212,168,67,.95)) drop-shadow(0 0 28px rgba(212,168,67,.55));}/* ── TOP TAG ── */.tag{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(16px,2vw,26px);letter-spacing:10px;text-transform:uppercase;color:rgba(212,168,67,.7);margin-bottom:1.8vh;opacity:0;animation:fadeUp .8s ease forwards 1.2s;}/* ── DIVIDER ── */.divider{display:flex;align-items:center;gap:1.5vw;margin-bottom:1.8vh;opacity:0;animation:fadeIn .8s ease forwards 1.5s;}.div-line{height:1px;width:clamp(45px,9vw,130px);background:linear-gradient(90deg,transparent,var(--gold));}.div-line.r{background:linear-gradient(90deg,var(--gold),transparent)}.div-gem{font-size:clamp(10px,1.3vw,16px);color:var(--gold);text-shadow:0 0 10px rgba(212,168,67,.8);}/* ── MAIN TITLE ── */.title-block{text-align:center;margin-bottom:1.5vh;}.t1{display:block;font-family:'Noto Serif Tamil',serif;font-size:clamp(40px,6.8vw,110px);font-weight:900;line-height:1.15;letter-spacing:4px;color:transparent;background:linear-gradient(160deg,#fff8e7 0%,var(--gold-light) 25%,var(--gold) 50%,var(--amber) 75%,#8b5c0f 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 30px rgba(212,168,67,.3));opacity:0;animation:slideDown 1s cubic-bezier(.2,1.4,.4,1) forwards 1.8s;}.t2{display:block;font-family:'Noto Serif Tamil',serif;font-size:clamp(26px,4.5vw,65px);font-weight:600;letter-spacing:14px;color:transparent;background:linear-gradient(90deg,rgba(212,168,67,.5) 0%,var(--gold-light) 50%,rgba(212,168,67,.5) 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmerText 4s ease-in-out infinite 3s, slideDown 1s cubic-bezier(.2,1.4,.4,1) forwards 2.1s;opacity:0;}@keyframes shimmerText{0%,100%{background-position:0% center}50%{background-position:200% center}}@keyframes slideDown{from{opacity:0;transform:translateY(-20px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes slideUp{from{opacity:0;transform:translateY(20px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}/* ── DIVIDER 2 ── */.divider2{margin-bottom:1.8vh;opacity:0;animation:fadeIn .8s ease forwards 2.6s;display:flex;align-items:center;gap:1vw;}.div2-line{height:1px;width:clamp(35px,7vw,100px);background:linear-gradient(90deg,transparent,rgba(212,168,67,.4))}.div2-line.r{background:linear-gradient(90deg,rgba(212,168,67,.4),transparent)}.div2-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}/* ── VERSE ── */.verse{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(16px,2vw,28px);color:rgba(240,204,112,.55);letter-spacing:2px;text-align:center;padding:0 12vw;line-height:2;opacity:0;animation:fadeUp .8s ease forwards 2.9s;}.verse cite{display:block;font-style:normal;font-family:'IM Fell English',serif;font-size:.9em;color:rgba(212,168,67,.35);letter-spacing:4px;margin-top:.6em;text-transform:uppercase;}/* ── BOTTOM TAGLINE - REMOVED ── *//* ── ANIMATIONS ── */@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}/* ── CANDLE GLOW BEHIND CROSS ── */.candle-glow{position:absolute;width:clamp(220px,32vw,450px);height:clamp(220px,32vw,450px);border-radius:50%;background:radial-gradient(circle,rgba(212,168,67,.12) 0%,rgba(180,100,20,.06) 40%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;animation:candleGlow 3s ease-in-out infinite;}@keyframes candleGlow{0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}/* Responsive */@media (max-width: 768px) {.tag{font-size:clamp(14px,1.8vw,22px);letter-spacing:8px;}.t1{font-size:clamp(36px,6.2vw,100px);}.t2{font-size:clamp(24px,4.2vw,60px);letter-spacing:12px;}.cross-symbol{font-size:clamp(46px,6.5vw,82px);}.verse{font-size:clamp(14px,1.8vw,24px);padding:0 8vw;}}</style></head><body><div class="stage"><canvas id="cFlame"></canvas><div class="vignette"></div><div class="candle-glow"></div><canvas id="cDust"></canvas><!-- Frame --><div class="frame"></div><div class="frame-corner fc-tl"><svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"><path d="M2 48 L2 2 L48 2" stroke-linecap="round"/><path d="M2 20 L2 2 L20 2" stroke-width="2.5" opacity=".8"/><circle cx="2" cy="2" r="2.5" fill="#d4a843" stroke="none"/><path d="M10 2 L10 8 M2 10 L8 10" opacity=".5"/></svg></div><div class="frame-corner fc-tr"><svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"><path d="M2 48 L2 2 L48 2" stroke-linecap="round"/><path d="M2 20 L2 2 L20 2" stroke-width="2.5" opacity=".8"/><circle cx="2" cy="2" r="2.5" fill="#d4a843" stroke="none"/><path d="M10 2 L10 8 M2 10 L8 10" opacity=".5"/></svg></div><div class="frame-corner fc-bl"><svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"><path d="M2 48 L2 2 L48 2" stroke-linecap="round"/><path d="M2 20 L2 2 L20 2" stroke-width="2.5" opacity=".8"/><circle cx="2" cy="2" r="2.5" fill="#d4a843" stroke="none"/><path d="M10 2 L10 8 M2 10 L8 10" opacity=".5"/></svg></div><div class="frame-corner fc-br"><svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"><path d="M2 48 L2 2 L48 2" stroke-linecap="round"/><path d="M2 20 L2 2 L20 2" stroke-width="2.5" opacity=".8"/><circle cx="2" cy="2" r="2.5" fill="#d4a843" stroke="none"/><path d="M10 2 L10 8 M2 10 L8 10" opacity=".5"/></svg></div><!-- CONTENT --><div class="content"><div class="halo"><div class="halo-ring"><span class="cross-symbol">✝</span></div></div><div class="tag">Welcome to</div><div class="divider"><div class="div-line"></div><span class="div-gem">✦</span><span class="div-gem" style="font-size:.6em;opacity:.5">✦</span><span class="div-gem">✦</span><div class="div-line r"></div></div><div class="title-block"><span class="t1">நல்ல சமாரியன் இயேசு</span><span class="t2">ஜெப வீடு</span></div><div class="divider2"><div class="div2-line"></div><div class="div2-dot"></div><div class="div2-dot" style="opacity:.4;width:3px;height:3px"></div><div class="div2-dot" style="opacity:.2;width:2px;height:2px"></div><div class="div2-dot" style="opacity:.2;width:2px;height:2px"></div><div class="div2-dot" style="opacity:.4;width:3px;height:3px"></div><div class="div2-dot"></div><div class="div2-line r"></div></div><div class="verse">என்னுடைய வீடு ஜெபவீடு என்னப்படும்<cite>— மத்தேயு 21:13</cite></div></div></div><script>/* ══════════════════════════════FLAME / EMBER BACKGROUND══════════════════════════════ */(function(){const cv = document.getElementById('cFlame');const cx = cv.getContext('2d');let W, H, t = 0;function resize(){W = cv.width  = window.innerWidth;H = cv.height = window.innerHeight;}resize();window.addEventListener('resize', resize);// Noise helper (simple smooth noise)function noise(x, y, t){return Math.sin(x * .012 + t * .008) * Math.cos(y * .009 - t * .006) * .5+ Math.sin(x * .007 - t * .005) * Math.sin(y * .013 + t * .007) * .3+ Math.sin((x+y) * .006 + t * .004) * .2;}function draw(){t++;cx.clearRect(0,0,W,H);// Deep warm baseconst bg = cx.createRadialGradient(W*.5, H*.7, 0, W*.5, H*.5, H*.9);bg.addColorStop(0,  'rgba(30,10,0,1)');bg.addColorStop(.3, 'rgba(20,6,0,1)');bg.addColorStop(.7, 'rgba(10,3,0,1)');bg.addColorStop(1,  'rgba(5,1,0,1)');cx.fillStyle = bg;cx.fillRect(0,0,W,H);// Slow fire columns rising from bottomconst cols = 12;for(let i=0;i<cols;i++){const cx_ = (i/(cols-1)) * W;const height = H * (.3 + noise(i*80, 0, t) * .25 + .15);const baseX  = cx_ + noise(i*60, t, 0) * 40;const alpha  = (.04 + Math.abs(noise(i*40, t*1.2, i)) * .06) * (1 - Math.abs((i/(cols-1))-.5)*1.2);if(alpha <= 0) continue;const grd = cx.createLinearGradient(baseX, H, baseX + noise(i,t,0)*20, H - height);grd.addColorStop(0,   `rgba(180,80,0,${alpha})`);grd.addColorStop(.35, `rgba(220,120,0,${alpha*.8})`);grd.addColorStop(.65, `rgba(200,140,30,${alpha*.4})`);grd.addColorStop(1,   `rgba(255,200,50,0)`);cx.save();cx.beginPath();const w = W / cols * (.6 + Math.abs(noise(i*30,t,0)) * .8);cx.ellipse(baseX, H, w*.5, height*.6, 0, 0, Math.PI*2);cx.fillStyle = grd;cx.fill();cx.restore();}// Central altar glowconst cg = cx.createRadialGradient(W*.5, H*.72, 0, W*.5, H*.65, H*.45);cg.addColorStop(0,   'rgba(212,168,67,.07)');cg.addColorStop(.3,  'rgba(180,100,20,.04)');cg.addColorStop(.6,  'rgba(150,60,0,.02)');cg.addColorStop(1,   'rgba(0,0,0,0)');cx.fillStyle = cg;cx.fillRect(0,0,W,H);requestAnimationFrame(draw);}draw();})();/* ══════════════════════════════GOLDEN DUST PARTICLES══════════════════════════════ */(function(){const cv = document.getElementById('cDust');const cx = cv.getContext('2d');let W, H, t = 0;function resize(){W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;}resize();window.addEventListener('resize', resize);class Mote {constructor(){ this.reset(true) }reset(init){this.x  = Math.random();this.y  = init ? Math.random() : 1.02;this.r  = Math.random() * 1.8 + .4;this.vy = -(Math.random() * .0006 + .0001);this.vx = (Math.random() - .5) * .0003;this.a  = 0;this.maxA = Math.random() * .6 + .15;this.phase = Math.random() * Math.PI * 2;this.speed = Math.random() * .02 + .01;// gold paletteconst palettes = [[212,168,67],[240,204,112],[255,235,150],[196,122,30],[255,200,80],[180,140,60]];this.color = palettes[Math.floor(Math.random()*palettes.length)];}update(){this.phase += this.speed;this.y  += this.vy;this.x  += this.vx + Math.sin(this.phase * .4) * .0001;// fade in/outif(this.y > .7) this.a = Math.min(this.maxA, this.a + .005);if(this.y < .2) this.a = Math.max(0, this.a - .003);if(this.y < -.03) this.reset(false);}draw(cx){if(this.a <= 0) return;const px = this.x * W, py = this.y * H;const [r,g,b] = this.color;const glow = (Math.sin(this.phase) * .5 + .5);cx.save();cx.globalAlpha = this.a * (.6 + glow * .4);cx.shadowColor = `rgba(${r},${g},${b},0.9)`;cx.shadowBlur  = this.r * 5;// alternating shapeif(this.r > 1.5){// tiny cross-sparklecx.strokeStyle = `rgba(${r},${g},${b},1)`;cx.lineWidth = .8;cx.beginPath();cx.moveTo(px - this.r*2, py); cx.lineTo(px + this.r*2, py);cx.moveTo(px, py - this.r*2); cx.lineTo(px, py + this.r*2);cx.stroke();} else {cx.beginPath();cx.arc(px, py, this.r, 0, Math.PI*2);cx.fillStyle = `rgba(${r},${g},${b},1)`;cx.fill();}cx.restore();}}// Slow drifting beamclass LightBeam {constructor(){ this.reset() }reset(){this.x = Math.random();this.w = Math.random() * .06 + .02;this.a = 0;this.maxA = Math.random() * .04 + .01;this.phase = Math.random() * Math.PI * 2;this.speed = Math.random() * .003 + .001;this.vx = (Math.random() - .5) * .0002;}update(){this.phase += this.speed;this.x += this.vx;this.a = this.maxA * (Math.sin(this.phase) * .5 + .5);if(this.x < -.1 || this.x > 1.1) this.vx *= -1;}draw(cx){if(this.a <= 0) return;const px = this.x * W;const g = cx.createLinearGradient(px - this.w*W*.5, 0, px + this.w*W*.5, 0);g.addColorStop(0,   'rgba(212,168,67,0)');g.addColorStop(.5,  `rgba(212,168,67,${this.a})`);g.addColorStop(1,   'rgba(212,168,67,0)');cx.fillStyle = g;cx.fillRect(px - this.w*W*.5, 0, this.w*W, H);}}const motes = Array.from({length:160}, () => new Mote());const beams = Array.from({length:5},  () => new LightBeam());function draw(){t++;cx.clearRect(0,0,W,H);beams.forEach(b => { b.update(); b.draw(cx); });motes.forEach(m => { m.update(); m.draw(cx); });requestAnimationFrame(draw);}draw();})();</script></body></html>
