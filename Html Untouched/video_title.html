<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>நல்ல சமாரியன் இயேசு ஜெப வீடு</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}

  .stage{
    width:100vw;height:100vh;
    position:relative;overflow:hidden;
  }

  .video-bg{
    position:absolute;inset:0;z-index:0;
    width:100%;height:100%;
    object-fit:cover;object-position:center;
  }

  .photo-fallback{
    position:absolute;inset:0;z-index:0;
    background:linear-gradient(160deg,#1a0f05 0%,#3d2210 30%,#1c1408 55%,#0a0810 100%);
  }

  /* slightly stronger overlay so text always pops */
  .overlay{
    position:absolute;inset:0;z-index:2;
    background:
      linear-gradient(
        170deg,
        rgba(10,5,0,.70)  0%,
        rgba(8,4,0,.35)   38%,
        rgba(8,4,0,.32)   60%,
        rgba(4,2,0,.85)  100%
      );
  }

  .glow-center{
    position:absolute;
    left:50%;top:48%;
    transform:translate(-50%,-50%);
    width:82vw;height:58vh;
    background:radial-gradient(ellipse,
      rgba(255,165,40,.08) 0%,
      rgba(200,100,20,.03) 45%,
      transparent 70%
    );
    z-index:3;
    animation:divineGlow 8s ease-in-out infinite;
  }
  @keyframes divineGlow{
    0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}
    50%    {opacity:1; transform:translate(-50%,-50%) scale(1.10)}
  }

  .rays{
    position:absolute;inset:0;z-index:2;
    background:conic-gradient(
      from 270deg at 50% 42%,
      transparent 0deg,
      rgba(255,185,50,.025) 3deg,
      transparent 6deg,
      transparent 20deg,
      rgba(255,185,50,.02) 23deg,
      transparent 26deg,
      transparent 45deg,
      rgba(255,185,50,.018) 48deg,
      transparent 51deg,
      transparent 360deg
    );
    animation:raysPulse 10s ease-in-out infinite;
  }
  @keyframes raysPulse{
    0%,100%{opacity:.5}
    50%    {opacity:1}
  }

  .vignette{
    position:absolute;inset:0;z-index:4;
    background:radial-gradient(ellipse at center,transparent 34%,rgba(0,0,0,.82) 100%);
  }

  /* ── CONTENT ── */
  .content{
    position:absolute;inset:0;z-index:11;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }

  /* welcome — gold accent, small so it works */
  .welcome{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-weight:400;
    font-size:clamp(11px,1.3vw,19px);
    letter-spacing:16px;text-transform:uppercase;
    color:rgba(238,200,120,.90);
    text-shadow:
      0 0 16px rgba(160,100,20,.60),
      0 2px 8px rgba(0,0,0,.95);
    margin-bottom:1.4vh;
    opacity:0;animation:fadeUp .9s ease forwards 1.1s;
  }

  /* orn 1 — gold accent line */
  .orn{
    width:50vw;height:1px;margin-bottom:1.8vh;
    opacity:0;transform:scaleX(0);
    animation:lineExpand .85s ease forwards 1.5s;
    background:linear-gradient(90deg,
      transparent,
      rgba(200,150,40,.40) 20%,
      rgba(255,215,80,.85) 50%,
      rgba(200,150,40,.40) 80%,
      transparent
    );
    position:relative;
  }
  .orn::before,.orn::after{
    content:'✦';position:absolute;top:-7px;
    font-size:11px;color:rgba(255,210,75,.90);
    text-shadow:0 0 10px rgba(200,150,35,.80);
  }
  .orn::before{left:-6px}.orn::after{right:-6px}

  /* ── TITLE 1 ──
     Pure white core shimmer — maximum contrast against sepia brown.
     Thin gold edges so it still feels warm/holy, not cold.
  ── */
  .t1-wrap{
    margin-bottom:.3vh;
    opacity:0;animation:fadeUp 1s ease forwards 1.8s;
  }
  .t1{
    display:block;
    font-family:'Noto Serif Tamil',serif;
    font-size:clamp(30px,5.5vw,86px);
    font-weight:900;line-height:1.15;
    white-space:nowrap;letter-spacing:3px;
    background:linear-gradient(90deg,
      #d4a820 0%,    /* warm gold edge */
      #ffffff 18%,   /* pure white */
      #ffffff 38%,   /* pure white */
      #fffef5 50%,   /* near-white centre */
      #ffffff 62%,   /* pure white */
      #ffffff 80%,   /* pure white */
      #d4a820 100%   /* warm gold edge */
    );
    background-size:200% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:whiteShimmer 5s linear infinite;
    /* strong dark drop shadow = crisp edge against brown bg */
    filter:
      drop-shadow(0 2px 2px rgba(0,0,0,1))
      drop-shadow(0 4px 12px rgba(0,0,0,.95))
      drop-shadow(0 0 30px rgba(255,255,255,.15));
  }

  /* ── TITLE 2 ──
     Cool silver-white with faint lavender — contrasts warm sepia perfectly.
  ── */
  .t2-wrap{
    opacity:0;animation:fadeUp 1s ease forwards 2.1s;
  }
  .t2{
    display:block;
    font-family:'Noto Serif Tamil',serif;
    font-size:clamp(22px,4.3vw,66px);
    font-weight:700;line-height:1.3;
    letter-spacing:14px;white-space:nowrap;
    background:linear-gradient(90deg,
      #c8b8f0 0%,    /* soft lavender-silver */
      #ffffff 20%,   /* white */
      #e8e0ff 38%,   /* silver-lavender */
      #ffffff 50%,   /* white */
      #e8e0ff 62%,   /* silver-lavender */
      #ffffff 80%,   /* white */
      #c8b8f0 100%   /* soft lavender-silver */
    );
    background-size:200% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:whiteShimmer 4s linear infinite;
    filter:
      drop-shadow(0 2px 2px rgba(0,0,0,1))
      drop-shadow(0 4px 12px rgba(0,0,0,.95))
      drop-shadow(0 0 25px rgba(200,185,255,.20));
  }

  @keyframes whiteShimmer{
    0%  {background-position:0%   center}
    100%{background-position:200% center}
  }

  /* orn 2 */
  .orn2{
    width:34vw;height:1px;
    margin-top:1.8vh;margin-bottom:1.6vh;
    opacity:0;transform:scaleX(0);
    animation:lineExpand .85s ease forwards 2.6s;
    background:linear-gradient(90deg,
      transparent,
      rgba(200,150,40,.45) 35%,
      rgba(255,215,80,.68) 65%,
      transparent
    );
  }

  /* verse — bright white-ivory, clearly readable */
  .verse{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-weight:600;
    font-size:clamp(11px,1.2vw,17px);
    letter-spacing:2px;text-align:center;
    padding:0 12vw;
    color:rgba(255,248,225,.92);
    text-shadow:
      0 1px 3px rgba(0,0,0,1),
      0 3px 12px rgba(0,0,0,.96),
      0 0 20px rgba(0,0,0,.80);
    opacity:0;animation:fadeUp .9s ease forwards 2.9s;
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(15px)}
    to  {opacity:1;transform:translateY(0)}
  }
  @keyframes lineExpand{to{opacity:1;transform:scaleX(1)}}
</style>
</head>
<body>
<div class="stage">

  <div class="photo-fallback"></div>

  <video class="video-bg" autoplay muted loop playsinline>
    <source src="bgv.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>
  <div class="rays"></div>
  <div class="glow-center"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="welcome">Welcome to</div>
    <div class="orn"></div>
    <div class="t1-wrap"><span class="t1">நல்ல சமாரியன் இயேசு</span></div>
    <div class="t2-wrap"><span class="t2">ஜெப வீடு</span></div>
    <div class="orn2"></div>
    <div class="verse">❝ என்னுடைய வீடு ஜெபவீடு என்னப்படும் ❞ — மத்தேயு 21:13</div>
  </div>

</div>
</body>
</html>
