<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>நல்ல சமாரியன் இயேசு ஜெப வீடு</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@1,400;0,600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}

  .stage{
    width:100vw;height:100vh;
    position:relative;overflow:hidden;
    background:#020008;
  }

  canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
  #cAurora{z-index:1}
  #cParticles{z-index:3}

  /* ── CONTENT ── */
  .content{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:0;
  }

  /* ── CROSS ── */
  .cross-wrap{
    margin-bottom:2.5vh;
    opacity:0;
    animation:crossIn 1.2s cubic-bezier(.34,1.56,.64,1) forwards .3s;
  }
  @keyframes crossIn{
    0%{opacity:0;transform:scale(.3) rotate(-20deg);filter:blur(20px)}
    100%{opacity:1;transform:scale(1) rotate(0deg);filter:blur(0)}
  }
  .cross-icon{
    font-size:clamp(44px,6vh,80px);
    display:block;text-align:center;
    background:linear-gradient(135deg,#fff 0%,#ffe066 30%,#ff6ec7 60%,#66cfff 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    background-size:300% 300%;
    animation:crossColorShift 3s ease-in-out infinite 1.5s;
    filter:drop-shadow(0 0 12px rgba(255,180,255,.6)) drop-shadow(0 0 30px rgba(100,200,255,.4));
  }
  @keyframes crossColorShift{
    0%,100%{background-position:0% 50%;filter:drop-shadow(0 0 12px rgba(255,180,255,.6)) drop-shadow(0 0 30px rgba(100,200,255,.4))}
    50%{background-position:100% 50%;filter:drop-shadow(0 0 20px rgba(255,220,100,.9)) drop-shadow(0 0 50px rgba(255,120,200,.6))}
  }

  /* ── WELCOME ── */
  .welcome{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-weight:400;
    font-size:clamp(12px,1.5vw,20px);
    letter-spacing:12px;
    text-transform:uppercase;
    margin-bottom:1.6vh;
    opacity:0;
    animation:fadeUp .9s ease forwards 1s;
    background:linear-gradient(90deg,#a78bfa,#f472b6,#fb923c,#facc15);
    background-size:300% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:welcomeAnim 3s ease-in-out infinite 1s,fadeUp .9s ease forwards 1s;
  }
  @keyframes welcomeAnim{
    0%,100%{background-position:0% center;opacity:1}
    50%{background-position:100% center}
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ── ORN LINE ── */
  .orn{
    width:55vw;height:1px;margin-bottom:2vh;
    opacity:0;transform:scaleX(0);
    animation:lineExpand .8s ease forwards 1.4s;
    background:linear-gradient(90deg,transparent,#a78bfa,#f472b6,#38bdf8,transparent);
    position:relative;
  }
  .orn::before,.orn::after{
    content:'◆';position:absolute;top:-7px;
    font-size:12px;color:#f472b6;
    text-shadow:0 0 10px #f472b6,0 0 20px #a78bfa;
  }
  .orn::before{left:-4px} .orn::after{right:-4px}
  @keyframes lineExpand{to{opacity:1;transform:scaleX(1)}}

  /* ── TITLE LINE 1 ── */
  .t1-wrap{
    overflow:visible;
    margin-bottom:.5vh;
    opacity:0;
    animation:fadeUp 1s ease forwards 1.7s;
  }
  .t1{
    display:block;
    font-family:'Noto Serif Tamil',serif;
    font-size:clamp(28px,5.2vw,80px);
    font-weight:900;
    line-height:1.2;
    white-space:nowrap;
    letter-spacing:3px;
    /* Trendy chrome-rainbow gradient */
    background:linear-gradient(
      90deg,
      #ff6b6b 0%,
      #ffd93d 15%,
      #6bcb77 28%,
      #4d96ff 42%,
      #c77dff 56%,
      #ff6b9d 70%,
      #ffd93d 85%,
      #ff6b6b 100%
    );
    background-size:200% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:rainbowFlow 4s linear infinite;
    filter:drop-shadow(0 0 15px rgba(200,120,255,.5)) drop-shadow(0 4px 20px rgba(0,0,0,.8));
  }
  @keyframes rainbowFlow{
    0%{background-position:0% center}
    100%{background-position:200% center}
  }

  /* ── TITLE LINE 2 ── */
  .t2-wrap{
    overflow:visible;
    opacity:0;
    animation:fadeUp 1s ease forwards 2s;
  }
  .t2{
    display:block;
    font-family:'Noto Serif Tamil',serif;
    font-size:clamp(22px,4vw,62px);
    font-weight:700;
    line-height:1.3;
    letter-spacing:10px;
    white-space:nowrap;
    /* Trendy aurora/neon gradient */
    background:linear-gradient(
      90deg,
      #00f5ff 0%,
      #7b2fff 20%,
      #ff2ff4 40%,
      #ff9500 60%,
      #00f5ff 80%,
      #7b2fff 100%
    );
    background-size:200% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:auroraFlow 3s linear infinite;
    filter:drop-shadow(0 0 20px rgba(0,245,255,.4)) drop-shadow(0 4px 20px rgba(0,0,0,.9));
  }
  @keyframes auroraFlow{
    0%{background-position:0% center}
    100%{background-position:200% center}
  }

  /* ── ORN 2 ── */
  .orn2{
    width:38vw;height:1px;margin-top:2vh;margin-bottom:1.6vh;
    opacity:0;transform:scaleX(0);
    animation:lineExpand .8s ease forwards 2.6s;
    background:linear-gradient(90deg,transparent,#38bdf8,#a78bfa,#f472b6,transparent);
  }

  /* ── VERSE ── */
  .verse{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-weight:600;
    font-size:clamp(11px,1.3vw,19px);
    letter-spacing:2px;text-align:center;
    padding:0 10vw;
    opacity:0;
    animation:fadeUp .9s ease forwards 2.9s;
    background:linear-gradient(90deg,#e0c3fc,#a5f3fc,#fde68a,#e0c3fc);
    background-size:300% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:verseShimmer 5s ease-in-out infinite 2.9s, fadeUp .9s ease forwards 2.9s;
  }
  @keyframes verseShimmer{
    0%,100%{background-position:0% center}
    50%{background-position:100% center}
  }

  /* ── CORNER BRACKETS ── */
  .corner{
    position:absolute;z-index:11;
    width:clamp(40px,5vw,70px);height:clamp(40px,5vw,70px);
    opacity:0;animation:cornerIn .8s ease forwards 2.3s;
    background:transparent;
  }
  @keyframes cornerIn{to{opacity:1}}
  .corner::before,.corner::after{
    content:'';position:absolute;background:transparent;
  }
  /* TL */
  .corner.tl{top:5vh;left:4vw;}
  .corner.tl::before{top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,#f472b6,#a78bfa);}
  .corner.tl::after{top:0;left:0;width:2px;height:100%;background:linear-gradient(180deg,#f472b6,#a78bfa);}
  /* TR */
  .corner.tr{top:5vh;right:4vw;}
  .corner.tr::before{top:0;right:0;left:auto;width:100%;height:2px;background:linear-gradient(90deg,#38bdf8,#6bcb77);}
  .corner.tr::after{top:0;right:0;left:auto;width:2px;height:100%;background:linear-gradient(180deg,#38bdf8,#6bcb77);}
  /* BL */
  .corner.bl{bottom:5vh;left:4vw;}
  .corner.bl::before{bottom:0;left:0;top:auto;width:100%;height:2px;background:linear-gradient(90deg,#ffd93d,#ff6b9d);}
  .corner.bl::after{bottom:0;left:0;top:auto;width:2px;height:100%;background:linear-gradient(0deg,#ffd93d,#ff6b9d);}
  /* BR */
  .corner.br{bottom:5vh;right:4vw;}
  .corner.br::before{bottom:0;right:0;left:auto;top:auto;width:100%;height:2px;background:linear-gradient(90deg,#6bcb77,#4d96ff);}
  .corner.br::after{bottom:0;right:0;left:auto;top:auto;width:2px;height:100%;background:linear-gradient(0deg,#6bcb77,#4d96ff);}

  /* ── FLOATING GLOW ORBS behind content ── */
  .orb{
    position:absolute;border-radius:50%;
    filter:blur(80px);z-index:2;
    animation:orbFloat ease-in-out infinite;
  }
  @keyframes orbFloat{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-30px) scale(1.1)}
  }
</style>
</head>
<body>
<div class="stage">

  <canvas id="cAurora"></canvas>

  <!-- Glow orbs -->
  <div class="orb" style="width:40vw;height:40vw;left:-10vw;top:10vh;background:rgba(167,139,250,.15);animation-duration:8s;animation-delay:0s"></div>
  <div class="orb" style="width:35vw;height:35vw;right:-8vw;top:20vh;background:rgba(244,114,182,.12);animation-duration:10s;animation-delay:-3s"></div>
  <div class="orb" style="width:30vw;height:30vw;left:30vw;bottom:5vh;background:rgba(56,189,248,.1);animation-duration:7s;animation-delay:-5s"></div>
  <div class="orb" style="width:25vw;height:25vw;left:60vw;top:5vh;background:rgba(251,191,36,.08);animation-duration:9s;animation-delay:-2s"></div>

  <canvas id="cParticles"></canvas>

  <!-- Corners -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- CONTENT -->
  <div class="content">
    <div class="cross-wrap"><span class="cross-icon">✝</span></div>
    <div class="welcome">Welcome to</div>
    <div class="orn"></div>
    <div class="t1-wrap"><span class="t1">நல்ல சமாரியன் இயேசு</span></div>
    <div class="t2-wrap"><span class="t2">ஜெப வீடு</span></div>
    <div class="orn2"></div>
    <div class="verse">❝ என்னுடைய வீடு ஜெபவீடு என்னப்படும் ❞ — மத்தேயு 21:13</div>
  </div>
</div>

<script>
/* ══════════════════════════════════
   AURORA BACKGROUND
══════════════════════════════════ */
(function(){
  const cv=document.getElementById('cAurora');
  const cx=cv.getContext('2d');
  let W,H,t=0;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);

  // aurora bands
  const bands=[
    {y:.2,  amp:.08, freq:.6,  speed:.007, color:[167,139,250], alpha:.25},
    {y:.35, amp:.10, freq:.5,  speed:.005, color:[244,114,182], alpha:.20},
    {y:.5,  amp:.07, freq:.8,  speed:.009, color:[56,189,248],  alpha:.18},
    {y:.65, amp:.09, freq:.55, speed:.006, color:[251,191,36],  alpha:.15},
    {y:.15, amp:.06, freq:.9,  speed:.011, color:[107,203,119], alpha:.12},
  ];

  function draw(){
    t+=1;
    cx.clearRect(0,0,W,H);

    // deep space base
    const bg=cx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#020008');
    bg.addColorStop(.4,'#060014');
    bg.addColorStop(.7,'#080018');
    bg.addColorStop(1,'#040010');
    cx.fillStyle=bg;cx.fillRect(0,0,W,H);

    // aurora bands
    bands.forEach(b=>{
      const baseY=b.y*H;
      const thickness=H*.22;
      cx.save();
      cx.beginPath();
      cx.moveTo(0,H);
      for(let x=0;x<=W;x+=8){
        const wave=Math.sin(x*b.freq*.01+t*b.speed)*b.amp*H
                  +Math.sin(x*b.freq*.007+t*b.speed*.7)*(b.amp*.5)*H;
        cx.lineTo(x,baseY+wave);
      }
      cx.lineTo(W,H);cx.closePath();

      const g=cx.createLinearGradient(0,baseY-thickness*.3,0,baseY+thickness*.7);
      g.addColorStop(0,`rgba(${b.color},0)`);
      g.addColorStop(.3,`rgba(${b.color},${b.alpha})`);
      g.addColorStop(.6,`rgba(${b.color},${b.alpha*.5})`);
      g.addColorStop(1,`rgba(${b.color},0)`);
      cx.fillStyle=g;cx.fill();
      cx.restore();
    });

    // moving light streaks
    for(let i=0;i<5;i++){
      const sx=((t*(.8+i*.3)+i*300)%(W+200))-100;
      const g=cx.createLinearGradient(sx-80,0,sx+80,0);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(.5,`rgba(255,255,255,${.04+i*.01})`);
      g.addColorStop(1,'rgba(255,255,255,0)');
      cx.fillStyle=g;cx.fillRect(sx-80,0,160,H);
    }

    requestAnimationFrame(draw);
  }
  draw();
})();


/* ══════════════════════════════════
   PARTICLE SYSTEM — colourful
══════════════════════════════════ */
(function(){
  const cv=document.getElementById('cParticles');
  const cx=cv.getContext('2d');
  let W,H,t=0;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);

  const COLORS=[
    [167,139,250],[244,114,182],[56,189,248],
    [251,191,36],[107,203,119],[255,107,107],
    [0,245,255],[255,46,244]
  ];

  class Star{
    constructor(){this.init()}
    init(){
      this.x=Math.random();
      this.y=Math.random();
      this.r=Math.random()*2.5+.5;
      this.vx=(Math.random()-.5)*.0005;
      this.vy=-(Math.random()*.0008+.0002);
      this.a=Math.random()*.8+.2;
      this.da=(Math.random()*.006+.002)*(Math.random()>.5?1:-1);
      this.c=COLORS[Math.floor(Math.random()*COLORS.length)];
      this.pulse=Math.random()*Math.PI*2;
      this.type=Math.random()>.7?'diamond':'circle';
    }
    update(){
      this.x+=this.vx;this.y+=this.vy;
      this.a+=this.da;this.pulse+=.04;
      if(this.a>.95||this.a<.1)this.da*=-1;
      if(this.y<-.02)this.y=1.02;
      if(this.x<0)this.x=1;if(this.x>1)this.x=0;
    }
    draw(cx){
      const px=this.x*W,py=this.y*H;
      const glow=Math.sin(this.pulse)*.5+.5;
      const [r,g,b]=this.c;

      cx.shadowColor=`rgba(${r},${g},${b},${glow*.8})`;
      cx.shadowBlur=this.r*6;
      cx.globalAlpha=this.a;

      if(this.type==='diamond'){
        const s=this.r*1.5;
        cx.beginPath();
        cx.moveTo(px,py-s);cx.lineTo(px+s,py);
        cx.lineTo(px,py+s);cx.lineTo(px-s,py);
        cx.closePath();
        cx.fillStyle=`rgba(${r},${g},${b},1)`;
        cx.fill();
        // sparkle arms
        cx.strokeStyle=`rgba(${r},${g},${b},${glow*.6})`;
        cx.lineWidth=.5;
        cx.beginPath();cx.moveTo(px-s*2.5,py);cx.lineTo(px+s*2.5,py);cx.stroke();
        cx.beginPath();cx.moveTo(px,py-s*2.5);cx.lineTo(px,py+s*2.5);cx.stroke();
      } else {
        cx.beginPath();cx.arc(px,py,this.r,0,Math.PI*2);
        cx.fillStyle=`rgba(${r},${g},${b},1)`;cx.fill();
      }
      cx.globalAlpha=1;cx.shadowBlur=0;
    }
  }

  // shooting stars
  class Streak{
    constructor(){this.init()}
    init(){
      this.x=Math.random()*1.5-.25;
      this.y=Math.random()*.5;
      this.len=Math.random()*.15+.06;
      this.speed=Math.random()*.012+.008;
      this.a=0;this.maxA=Math.random()*.7+.3;
      this.c=COLORS[Math.floor(Math.random()*COLORS.length)];
      this.alive=true;this.phase=0;
    }
    update(){
      this.phase+=.03;
      if(this.phase<1) this.a=Math.min(this.maxA,this.phase*this.maxA*3);
      else this.a=Math.max(0,this.a-.015);
      this.x+=this.speed*.7;this.y+=this.speed*.4;
      if(this.a<=0&&this.phase>1)this.alive=false;
    }
    draw(cx){
      if(this.a<=0)return;
      const [r,g,b]=this.c;
      const x1=this.x*W,y1=this.y*H;
      const x2=x1-this.len*W*.7,y2=y1-this.len*H*.4;
      const grad=cx.createLinearGradient(x2,y2,x1,y1);
      grad.addColorStop(0,`rgba(${r},${g},${b},0)`);
      grad.addColorStop(1,`rgba(${r},${g},${b},${this.a})`);
      cx.save();
      cx.strokeStyle=grad;cx.lineWidth=1.5;
      cx.shadowColor=`rgba(${r},${g},${b},.6)`;cx.shadowBlur=6;
      cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x1,y1);cx.stroke();
      cx.restore();
    }
  }

  const stars=Array.from({length:200},()=>new Star());
  const streaks=[];
  let streakTimer=0;

  function draw(){
    t++;streakTimer++;
    cx.clearRect(0,0,W,H);

    // spawn streak every ~90 frames
    if(streakTimer>90+Math.random()*60){
      streaks.push(new Streak());streakTimer=0;
    }

    stars.forEach(s=>{s.update();s.draw(cx)});

    // streaks
    for(let i=streaks.length-1;i>=0;i--){
      streaks[i].update();streaks[i].draw(cx);
      if(!streaks[i].alive)streaks.splice(i,1);
    }

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
