<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>அறிவிப்பு - நல்ல சமாரியன் இயேசு ஜெப வீடு</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}

  .stage{
    width:100vw;height:100vh;
    position:relative;overflow:hidden;
  }

  /* ── SKY GRADIENT — deep royal blue to golden dawn (announcement feel) ── */
  .sky{
    position:absolute;inset:0;
    background:linear-gradient(
      170deg,
      #05102a 0%,
      #0e2257 12%,
      #1a4a8a 26%,
      #2e6db4 40%,
      #5299d3 54%,
      #8ac4e8 68%,
      #c9e8f7 82%,
      #f0f8ff 92%,
      #ffffff 100%
    );
    z-index:0;
  }

  /* ── MEGAPHONE / BELL GLOW ── */
  .bell-glow{
    position:absolute;
    top:-10vh;
    left:50%;
    transform:translateX(-50%);
    width:55vw;height:55vw;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(180,220,255,0.55) 0%,
      rgba(100,170,255,0.3) 30%,
      rgba(50,120,220,0.1) 60%,
      transparent 100%
    );
    z-index:1;
    animation:bellPulse 3.5s ease-in-out infinite;
  }
  @keyframes bellPulse{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.8}
    50%{transform:translateX(-50%) scale(1.08);opacity:1}
  }

  /* ── CANVASES ── */
  canvas.rays{position:absolute;inset:0;z-index:2;pointer-events:none}
  canvas.stars{position:absolute;inset:0;z-index:3;pointer-events:none}
  canvas.bells{position:absolute;inset:0;z-index:5;pointer-events:none}

  /* ── MIST ── */
  .mist{
    position:absolute;
    bottom:0;left:0;right:0;
    height:28vh;
    background:linear-gradient(to top,
      rgba(240,248,255,0.65) 0%,
      rgba(200,230,255,0.25) 50%,
      transparent 100%
    );
    z-index:4;
  }

  /* ── CONTENT ── */
  .content{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }

  /* ── CARD ── */
  .card{
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.4);
    border-radius:26px;
    padding:clamp(22px,3.8vh,48px) clamp(30px,5.5vw,85px);
    display:flex;flex-direction:column;
    align-items:center;gap:0;
    box-shadow:
      0 8px 60px rgba(20,60,140,0.3),
      0 2px 20px rgba(100,180,255,0.2),
      inset 0 1px 0 rgba(255,255,255,0.55);
    opacity:0;
    animation:cardReveal 1.2s cubic-bezier(.22,1,.36,1) forwards .4s;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(135deg,
      rgba(255,255,255,0.2) 0%,
      rgba(150,210,255,0.08) 50%,
      rgba(255,255,255,0.05) 100%
    );
    border-radius:26px;
    pointer-events:none;
  }
  @keyframes cardReveal{
    from{opacity:0;transform:translateY(30px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* ── ICON ROW ── */
  .icon-row{
    display:flex;align-items:center;gap:1.3vw;
    margin-bottom:1.2vh;
    opacity:0;animation:fadeUp .9s ease forwards .8s;
  }
  .icon-emoji{
    font-size:clamp(22px,3.2vw,46px);
    animation:iconBounce 2.8s ease-in-out infinite;
    filter:drop-shadow(0 2px 8px rgba(30,80,200,.4));
  }
  .icon-emoji:nth-child(1){animation-delay:0s}
  .icon-emoji:nth-child(2){animation-delay:.35s}
  .icon-emoji:nth-child(3){animation-delay:.7s}
  @keyframes iconBounce{
    0%,100%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-9px) rotate(4deg)}
  }

  /* ── TOP SCRIPT ── */
  .script-top{
    font-family:'Lora',serif;
    font-style:italic;font-weight:400;
    font-size:clamp(10px,1.25vw,16px);
    letter-spacing:8px;
    text-transform:uppercase;
    color:rgba(20,60,140,0.7);
    margin-bottom:1.2vh;
    opacity:0;animation:fadeUp .8s ease forwards 1s;
  }

  /* ── DIVIDER ── */
  .divider{
    display:flex;align-items:center;gap:1.2vw;
    margin-bottom:1.8vh;
    opacity:0;animation:fadeUp .8s ease forwards 1.2s;
    width:100%;
  }
  .div-line{
    flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(40,100,220,.45),transparent);
  }
  .div-icon{font-size:clamp(10px,1.3vw,17px);color:rgba(40,100,200,.65)}

  /* ── MAIN WORD ── */
  .main-word{
    font-family:'Noto Serif Tamil',serif;
    font-size:clamp(52px,9vw,140px);
    font-weight:900;
    line-height:1.15;
    letter-spacing:6px;
    padding-top:0.1em;
    background:linear-gradient(
      155deg,
      #0a2a6e 0%,
      #1a4fbb 18%,
      #2e8de8 34%,
      #56c2f5 50%,
      #1a6fcc 66%,
      #0d3590 82%,
      #1a4fbb 100%
    );
    background-size:260% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 4px 22px rgba(30,90,220,.35));
    opacity:0;
    animation:wordReveal 1.1s cubic-bezier(.34,1.56,.64,1) forwards 1.4s,
              wordFlow 5s ease-in-out infinite 2.5s;
    margin-bottom:.4vh;
  }
  @keyframes wordReveal{
    from{opacity:0;transform:scale(.6);filter:blur(15px) drop-shadow(0 4px 22px rgba(30,90,220,.35))}
    to{opacity:1;transform:scale(1);filter:blur(0) drop-shadow(0 4px 22px rgba(30,90,220,.35))}
  }
  @keyframes wordFlow{
    0%,100%{background-position:0% center}
    50%{background-position:100% center}
  }

  /* ── SUBTITLE ── */
  .subtitle{
    font-family:'Noto Serif Tamil',serif;
    font-size:clamp(13px,2vw,28px);
    font-weight:700;
    color:rgba(15,45,120,0.85);
    letter-spacing:4px;
    margin-bottom:1.8vh;
    opacity:0;animation:fadeUp .9s ease forwards 1.9s;
    text-shadow:0 1px 10px rgba(100,180,255,.4);
  }

  /* ── VERSE BOX ── */
  .verse-box{
    background:rgba(180,220,255,0.2);
    border:1px solid rgba(60,130,220,.3);
    border-radius:14px;
    padding:clamp(10px,1.4vh,17px) clamp(16px,2.8vw,38px);
    margin-bottom:1.6vh;
    opacity:0;animation:fadeUp .9s ease forwards 2.2s;
    max-width:70vw;
    text-align:center;
  }
  .verse-text{
    font-family:'Lora',serif;
    font-style:italic;
    font-size:clamp(11px,1.4vw,19px);
    color:rgba(10,35,100,0.9);
    line-height:1.85;
    letter-spacing:1px;
  }
  .verse-ref{
    font-family:'Lora',serif;
    font-size:clamp(10px,1.05vw,14px);
    color:rgba(30,80,180,.65);
    letter-spacing:3px;
    margin-top:.5vh;
  }

  /* ── CHURCH BADGE ── */
  .church-wrapper{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    animation:churchEntrance 1s cubic-bezier(.34,1.56,.64,1) forwards 2.7s;
    margin-top:.3vh;
  }
  @keyframes churchEntrance{
    from{opacity:0;transform:scale(.5) rotate(-12deg)}
    to{opacity:1;transform:scale(1) rotate(0deg)}
  }
  .church-bg{
    position:absolute;
    inset:3px;
    border-radius:46px;
    background:rgba(5,12,40,0.9);
    z-index:1;
  }
  .church{
    position:relative;
    z-index:2;
    font-family:'Noto Serif Tamil',serif;
    font-weight:900;
    font-size:clamp(11px,1.4vw,19px);
    letter-spacing:3px;
    padding:clamp(6px,1vh,12px) clamp(18px,2.4vw,34px);
    white-space:nowrap;
    background:linear-gradient(
      90deg,
      #7ee8ff 0%,
      #ffdd57 18%,
      #72f5a8 36%,
      #a259ff 54%,
      #7ee8ff 72%,
      #ffdd57 90%,
      #72f5a8 100%
    );
    background-size:300% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    animation:rainbowShift 3s linear infinite;
    filter:drop-shadow(0 0 6px rgba(100,220,255,.7))
           drop-shadow(0 0 14px rgba(162,89,255,.5));
  }
  @keyframes rainbowShift{
    0%{background-position:0% center}
    100%{background-position:300% center}
  }

  /* sparkles */
  .church-sparks{position:absolute;inset:0;border-radius:50px;z-index:3;pointer-events:none;overflow:visible}
  .spark{position:absolute;border-radius:50%;top:50%;left:50%;transform-origin:0 0;width:clamp(4px,.55vw,8px);height:clamp(4px,.55vw,8px)}
  .spark:nth-child(1){background:#7ee8ff;animation:orbitSpark 2.4s linear infinite 0s}
  .spark:nth-child(2){background:#ffdd57;animation:orbitSpark 2.4s linear infinite .4s}
  .spark:nth-child(3){background:#72f5a8;animation:orbitSpark 2.4s linear infinite .8s}
  .spark:nth-child(4){background:#a259ff;animation:orbitSpark 2.4s linear infinite 1.2s}
  .spark:nth-child(5){background:#ff6ec7;animation:orbitSpark 2.4s linear infinite 1.6s}
  .spark:nth-child(6){background:#ffbe00;animation:orbitSpark 2.4s linear infinite 2.0s}
  @keyframes orbitSpark{
    0%  {transform:rotate(0deg)   translateX(clamp(22px,3.4vw,46px)) scale(1)}
    50% {transform:rotate(180deg) translateX(clamp(22px,3.4vw,46px)) scale(1.5)}
    100%{transform:rotate(360deg) translateX(clamp(22px,3.4vw,46px)) scale(1)}
  }

  /* ── BOTTOM DECORATION ── */
  .deco-row{
    position:absolute;
    bottom:-2px;left:0;right:0;
    display:flex;justify-content:center;
    gap:.45vw;overflow:hidden;
    z-index:11;pointer-events:none;
  }
  .deco-item{
    font-size:clamp(15px,2.3vw,34px);
    opacity:.5;
    animation:decoSway 3.2s ease-in-out infinite;
    transform-origin:bottom center;
  }
  .deco-item:nth-child(2n){animation-delay:.5s}
  .deco-item:nth-child(3n){animation-delay:1s}
  .deco-item:nth-child(4n){animation-delay:1.5s}
  @keyframes decoSway{
    0%,100%{transform:rotate(-6deg)}
    50%{transform:rotate(6deg)}
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
  }
</style>
</head>
<body>
<div class="stage">

  <div class="sky"></div>
  <div class="bell-glow"></div>

  <canvas class="rays" id="cRays"></canvas>
  <canvas class="stars" id="cStars"></canvas>
  <div class="mist"></div>
  <canvas class="bells" id="cBells"></canvas>

  <div class="content">
    <div class="card">

      <!-- Icon row: megaphone / bell / cross -->
      <div class="icon-row">
        <span class="icon-emoji">📣</span>
        <span class="icon-emoji">✝</span>
        <span class="icon-emoji">🔔</span>
      </div>

      <div class="script-top">கவனியுங்கள் • Please Note</div>

      <div class="divider">
        <div class="div-line"></div>
        <span class="div-icon">📢</span>
        <div class="div-line"></div>
      </div>

      <!-- BIG WORD -->
      <div class="main-word">அறிவிப்பு</div>
      <div class="subtitle">Announcement · Information</div>

      <div class="verse-box">
        <div class="verse-text">
          ❝ உங்கள் கோரிக்கைகளை தேவனுக்கு தெரிவியுங்கள் ❞
        </div>
        <div class="verse-ref">— பிலிப்பியர் 4:6</div>
      </div>

      <!-- CHURCH BADGE -->
      <div class="church-wrapper">
        <div class="church-bg"></div>
        <div class="church">நல்ல சமாரியன் இயேசு ஜெப வீடு</div>
      </div>

    </div>
  </div>

  <!-- bottom deco -->
  <div class="deco-row">
    <span class="deco-item">⭐</span><span class="deco-item">✨</span>
    <span class="deco-item">⭐</span><span class="deco-item">🌟</span>
    <span class="deco-item">⭐</span><span class="deco-item">✨</span>
    <span class="deco-item">⭐</span><span class="deco-item">🌟</span>
    <span class="deco-item">⭐</span><span class="deco-item">✨</span>
    <span class="deco-item">⭐</span><span class="deco-item">🌟</span>
    <span class="deco-item">⭐</span><span class="deco-item">✨</span>
    <span class="deco-item">⭐</span>
  </div>

</div>

<script>
/* ── LIGHT RAYS (blue tone) ── */
(function(){
  const cv=document.getElementById('cRays');
  const cx=cv.getContext('2d');
  let W,H,t=0;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();addEventListener('resize',resize);
  const RAYS=Array.from({length:20},(_,i)=>({
    angle:(i/20)*Math.PI-Math.PI/2+(Math.random()-.5)*.3,
    width:2+Math.random()*5,
    alpha:.035+Math.random()*.07,
    speed:(.002+Math.random()*.003)*(Math.random()>.5?1:-1),
    length:.55+Math.random()*.55
  }));
  const OX=W*.5,OY=H*-.05;
  function draw(){
    t++;cx.clearRect(0,0,W,H);
    RAYS.forEach(r=>{
      r.angle+=r.speed;
      const ax=Math.cos(r.angle)*W*r.length+OX;
      const ay=Math.sin(r.angle)*W*r.length+OY;
      const bx=Math.cos(r.angle+.04)*W*r.length+OX;
      const by=Math.sin(r.angle+.04)*W*r.length+OY;
      cx.save();
      const g=cx.createLinearGradient(OX,OY,ax,ay);
      g.addColorStop(0,`rgba(150,210,255,${r.alpha*2})`);
      g.addColorStop(.4,`rgba(100,180,255,${r.alpha})`);
      g.addColorStop(1,'rgba(100,180,255,0)');
      cx.beginPath();cx.moveTo(OX,OY);cx.lineTo(ax,ay);cx.lineTo(bx,by);cx.closePath();
      cx.fillStyle=g;cx.fill();cx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── TWINKLING STARS ── */
(function(){
  const cv=document.getElementById('cStars');
  const cx=cv.getContext('2d');
  let W,H,t=0;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();addEventListener('resize',resize);
  const STARS=Array.from({length:55},()=>({
    x:Math.random(),y:Math.random()*.55,
    r:Math.random()*2.2+.5,
    phase:Math.random()*Math.PI*2,
    speed:Math.random()*.025+.012
  }));
  function draw(){
    t++;cx.clearRect(0,0,W,H);
    STARS.forEach(s=>{
      const alpha=.3+.7*(.5+.5*Math.sin(t*s.speed+s.phase));
      cx.save();
      cx.globalAlpha=alpha;
      cx.fillStyle='rgba(200,230,255,1)';
      cx.shadowColor='rgba(150,210,255,.9)';
      cx.shadowBlur=s.r*4;
      cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);cx.fill();
      cx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── FLOATING BELL RINGS ── */
(function(){
  const cv=document.getElementById('cBells');
  const cx=cv.getContext('2d');
  let W,H,t=0;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();addEventListener('resize',resize);

  class Ring{
    constructor(){this.reset(true);}
    reset(rand){
      this.x=(0.25+Math.random()*.5)*W;
      this.y=rand?(Math.random()*H):(H+30);
      this.vy=-(Math.random()*.6+.25);
      this.r=Math.random()*18+8;
      this.maxR=this.r*5;
      this.alpha=Math.random()*.4+.2;
      this.growing=true;
    }
    update(){
      this.y+=this.vy;
      this.r+=.4;
      this.alpha-=.004;
      if(this.alpha<=0||this.y<-50)this.reset(false);
    }
    draw(cx){
      cx.save();
      cx.globalAlpha=Math.max(0,this.alpha);
      cx.strokeStyle='rgba(100,180,255,0.7)';
      cx.lineWidth=1.5;
      cx.shadowColor='rgba(100,200,255,0.5)';
      cx.shadowBlur=6;
      cx.beginPath();cx.arc(this.x,this.y,this.r,0,Math.PI*2);cx.stroke();
      cx.restore();
    }
  }

  const rings=Array.from({length:12},()=>new Ring());
  function draw(){
    t++;cx.clearRect(0,0,W,H);
    if(t%40===0&&rings.length<18)rings.push(new Ring());
    rings.forEach(r=>{r.update();r.draw(cx);});
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
