<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ஜெப நேரம் — பிறந்தநாள் & திருமண நாள்</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Noto Serif Tamil', serif;
}

.slide {
  width: 100vw; height: 100vh;
  position: relative;
  background: radial-gradient(ellipse at 30% 40%, #12000a 0%, #0a0005 40%, #000000 100%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ── Particle canvas ── */
#particles { position: absolute; inset: 0; z-index: 1; }

/* ── Ambient glow blobs ── */
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 2;
  animation: blobPulse 5s ease-in-out infinite;
}
.blob1 { width: 50vw; height: 50vh; background: rgba(180,20,80,0.18); top: -10vh; left: -10vw; animation-delay: 0s; }
.blob2 { width: 40vw; height: 40vh; background: rgba(212,160,23,0.15); bottom: -5vh; right: -5vw; animation-delay: 2s; }
.blob3 { width: 30vw; height: 30vh; background: rgba(255,80,120,0.1); top: 30vh; left: 35vw; animation-delay: 3.5s; }

@keyframes blobPulse {
  0%,100% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.15); opacity: 1; }
}

/* ── Golden border lines ── */
.line-top, .line-bottom {
  position: absolute;
  width: 80%; height: 1.5px;
  left: 10%; z-index: 5;
  background: linear-gradient(90deg, transparent, #c8952a, #f5d97a, #fff5c0, #f5d97a, #c8952a, transparent);
  transform: scaleX(0);
  transform-origin: center;
  animation: lineExpand 1.2s cubic-bezier(0.4,0,0.2,1) forwards;
}
.line-top { top: 12vh; animation-delay: 0.2s; }
.line-bottom { bottom: 12vh; animation-delay: 0.4s; }

.line-top::before, .line-top::after,
.line-bottom::before, .line-bottom::after {
  content: '◆';
  position: absolute;
  top: -9px;
  font-size: 14px;
  color: #f5d97a;
  text-shadow: 0 0 12px #ffd700, 0 0 24px #ffd700;
}
.line-top::before, .line-bottom::before { left: -7px; }
.line-top::after, .line-bottom::after { right: -7px; }

@keyframes lineExpand { to { transform: scaleX(1); } }

/* ── Corner ornaments ── */
.corner {
  position: absolute;
  width: clamp(55px, 6vw, 90px);
  height: clamp(55px, 6vw, 90px);
  z-index: 5;
  opacity: 0;
  animation: fadeIn 1s ease forwards 1.2s;
}
.corner svg { width: 100%; height: 100%; }
.tl { top: 18px; left: 18px; }
.tr { top: 18px; right: 18px; transform: scaleX(-1); }
.bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
.br { bottom: 18px; right: 18px; transform: scale(-1,-1); }

/* ── Floating icons row ── */
.icons-row {
  position: relative; z-index: 6;
  display: flex; gap: 3vw;
  align-items: center;
  margin-bottom: 2.5vh;
  opacity: 0;
  animation: dropIn 1s cubic-bezier(0.34,1.56,0.64,1) forwards 0.5s;
}

.icon-wrap {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
}

.icon-emoji {
  font-size: clamp(36px, 5.5vw, 72px);
  filter: drop-shadow(0 0 14px rgba(255,120,160,0.9)) drop-shadow(0 0 30px rgba(255,80,120,0.5));
  animation: iconFloat 3s ease-in-out infinite;
}
.icon-emoji.rings {
  filter: drop-shadow(0 0 14px rgba(255,215,0,0.9)) drop-shadow(0 0 30px rgba(255,180,0,0.5));
  animation-delay: 1s;
}

@keyframes iconFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.divider-dot {
  font-size: clamp(20px, 2.5vw, 36px);
  color: #f5d97a;
  opacity: 0.5;
}

/* ── Main heading ── */
.heading {
  position: relative; z-index: 6;
  text-align: center;
  padding: 0 8vw;
  opacity: 0;
  animation: revealBlur 1.3s cubic-bezier(0.22,1,0.36,1) forwards 0.8s;
}

@keyframes revealBlur {
  from { opacity:0; transform: scale(0.88) translateY(24px); filter: blur(10px); }
  to   { opacity:1; transform: scale(1) translateY(0); filter: blur(0); }
}

.heading-sub {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(9px, 1.1vw, 15px);
  letter-spacing: 10px;
  color: #c8952a;
  text-transform: uppercase;
  margin-bottom: 1.2vh;
}

.heading-main {
  font-size: clamp(32px, 5.5vw, 78px);
  font-weight: 900;
  line-height: 1.15;
  background: linear-gradient(180deg, #fff5c0 0%, #f5d97a 30%, #e87fa0 60%, #c0305a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 4px 20px rgba(255,100,140,0.4));
  letter-spacing: 2px;
}

.heading-eng {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(22px, 3.2vw, 48px);
  color: rgba(245,217,122,0.6);
  margin-top: 0.5vh;
  letter-spacing: 3px;
}

/* ── Invitation strip ── */
.invite-strip {
  position: relative; z-index: 6;
  margin-top: 3vh;
  padding: 1.4vh 4vw;
  border: 1px solid rgba(245,217,122,0.3);
  border-radius: 4px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(4px);
  text-align: center;
  opacity: 0;
  animation: fadeUp 1s ease forwards 1.5s;
  max-width: 80vw;
}

.invite-strip::before, .invite-strip::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,120,160,0.6), transparent);
}
.invite-strip::before { top: 0; }
.invite-strip::after  { bottom: 0; }

.invite-text {
  font-size: clamp(12px, 1.6vw, 22px);
  color: #f5d97a;
  letter-spacing: 1.5px;
  line-height: 1.7;
}
.invite-highlight {
  color: #ff8fb0;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(255,80,120,0.7);
}

/* ── Prayer call ── */
.prayer-call {
  position: relative; z-index: 6;
  margin-top: 2.5vh;
  display: flex;
  align-items: center;
  gap: 1.2vw;
  opacity: 0;
  animation: fadeUp 1s ease forwards 1.9s;
}

.prayer-hands {
  font-size: clamp(20px, 2.8vw, 40px);
  animation: handsWave 2.5s ease-in-out infinite;
}

@keyframes handsWave {
  0%,100% { transform: rotate(-5deg) scale(1); }
  50% { transform: rotate(5deg) scale(1.1); }
}

.prayer-text {
  font-size: clamp(11px, 1.3vw, 18px);
  color: rgba(245,217,122,0.65);
  letter-spacing: 2px;
  font-style: italic;
}

/* ── Confetti hearts & stars ── */
.confetti-piece {
  position: absolute;
  z-index: 3;
  font-size: clamp(12px, 1.6vw, 22px);
  animation: confettiFall linear infinite;
  opacity: 0;
}

@keyframes confettiFall {
  0%   { transform: translateY(-5vh) rotate(0deg); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 0.7; }
  100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

/* ── Shimmer sweep on heading ── */
.heading::after {
  content: '';
  position: absolute;
  top: 0; left: -200%;
  width: 60%; height: 100%;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,220,0.18) 50%, transparent 70%);
  animation: shimmer 5s ease-in-out infinite;
  animation-delay: 2.5s;
  pointer-events: none;
}
@keyframes shimmer {
  0%   { left: -200%; }
  60%  { left: 200%; }
  100% { left: 200%; }
}

/* ── Candles ── */
.candle {
  position: absolute;
  z-index: 4;
  font-size: clamp(28px, 3.5vw, 52px);
  opacity: 0;
  animation: candleAppear 1s ease forwards 1.4s;
}
.candle.left  { left: 5vw;  top: 50%; transform: translateY(-50%); }
.candle.right { right: 5vw; top: 50%; transform: translateY(-50%); animation-delay: 1.5s; }

@keyframes candleAppear {
  from { opacity:0; transform: translateY(calc(-50% + 12px)); }
  to   { opacity:1; transform: translateY(-50%); }
}

.flame {
  display: inline-block;
  animation: flicker 1.1s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 10px #ff4400) drop-shadow(0 0 22px #ff8800);
}
@keyframes flicker {
  0%   { transform: rotate(-4deg) scaleY(1); }
  100% { transform: rotate(4deg) scaleY(1.12); }
}

/* ── Utilities ── */
@keyframes dropIn {
  from { opacity:0; transform: translateY(-30px) scale(0.7); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(18px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes fadeIn {
  to { opacity:1; }
}
</style>
</head>
<body>
<div class="slide">

  <canvas id="particles"></canvas>

  <!-- Ambient blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <!-- Confetti generated by JS -->
  <div id="confettiBox"></div>

  <!-- Gold lines -->
  <div class="line-top"></div>
  <div class="line-bottom"></div>

  <!-- Corners -->
  <div class="corner tl">
    <svg viewBox="0 0 80 80" fill="none">
      <path d="M5 75L5 5L75 5" stroke="url(#cg1)" stroke-width="2"/>
      <path d="M5 5L25 25" stroke="url(#cg1)" stroke-width="1.5"/>
      <circle cx="5" cy="5" r="4" fill="#f5d97a"/>
      <circle cx="5" cy="75" r="3" fill="#c8952a"/>
      <circle cx="75" cy="5" r="3" fill="#c8952a"/>
      <defs><linearGradient id="cg1" x1="0" y1="0" x2="80" y2="80">
        <stop offset="0%" stop-color="#f5d97a"/><stop offset="100%" stop-color="#c8952a"/>
      </linearGradient></defs>
    </svg>
  </div>
  <div class="corner tr">
    <svg viewBox="0 0 80 80" fill="none">
      <path d="M5 75L5 5L75 5" stroke="url(#cg2)" stroke-width="2"/>
      <circle cx="5" cy="5" r="4" fill="#f5d97a"/>
      <defs><linearGradient id="cg2" x1="0" y1="0" x2="80" y2="80">
        <stop offset="0%" stop-color="#f5d97a"/><stop offset="100%" stop-color="#c8952a"/>
      </linearGradient></defs>
    </svg>
  </div>
  <div class="corner bl">
    <svg viewBox="0 0 80 80" fill="none">
      <path d="M5 75L5 5L75 5" stroke="url(#cg3)" stroke-width="2"/>
      <circle cx="5" cy="5" r="4" fill="#f5d97a"/>
      <defs><linearGradient id="cg3" x1="0" y1="0" x2="80" y2="80">
        <stop offset="0%" stop-color="#f5d97a"/><stop offset="100%" stop-color="#c8952a"/>
      </linearGradient></defs>
    </svg>
  </div>
  <div class="corner br">
    <svg viewBox="0 0 80 80" fill="none">
      <path d="M5 75L5 5L75 5" stroke="url(#cg4)" stroke-width="2"/>
      <circle cx="5" cy="5" r="4" fill="#f5d97a"/>
      <defs><linearGradient id="cg4" x1="0" y1="0" x2="80" y2="80">
        <stop offset="0%" stop-color="#f5d97a"/><stop offset="100%" stop-color="#c8952a"/>
      </linearGradient></defs>
    </svg>
  </div>

  <!-- Icons -->
  <div class="icons-row">
    <div class="icon-wrap">
      <span class="icon-emoji">🎂</span>
    </div>
    <span class="divider-dot">✦</span>
    <div class="icon-wrap">
      <span class="icon-emoji rings">💍</span>
    </div>
  </div>

  <!-- Heading -->
  <div class="heading">
    <div class="heading-sub">Special Blessing Time</div>
    <div class="heading-main">பிறந்தநாள் & திருமண நாள்</div>
    <div class="heading-eng">Birthday & Wedding Anniversary</div>
  </div>

  <!-- Invite strip -->
  <div class="invite-strip">
    <div class="invite-text">
      இந்த வாரம் / இன்று <span class="invite-highlight">பிறந்தநாள்</span> அல்லது <span class="invite-highlight">திருமண நாள்</span> உள்ளவர்கள்<br>
      தயவுசெய்து எழுந்து நிற்கவும் — நாம் உங்களுக்காக ஜெபிப்போம்!
    </div>
  </div>

  <!-- Prayer call -->
  <div class="prayer-call">
    <span class="prayer-hands">🙏</span>
    <span class="prayer-text">❝ கர்த்தர் உங்களை ஆசீர்வதிப்பார் ❞</span>
    <span class="prayer-hands">🙏</span>
  </div>

</div>

<script>
/* ── Particles ── */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

const pts = Array.from({length: 180}, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  r: Math.random() * 2 + 0.4,
  dx: (Math.random() - 0.5) * 0.35,
  dy: -Math.random() * 0.5 - 0.1,
  alpha: Math.random(),
  aDir: Math.random() > 0.5 ? 0.007 : -0.007,
  pink: Math.random() > 0.55
}));

(function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pts.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.pink
      ? `rgba(255,140,180,${p.alpha * 0.7})`
      : `rgba(245,217,122,${p.alpha})`;
    ctx.fill();
    p.x += p.dx; p.y += p.dy;
    p.alpha += p.aDir;
    if (p.alpha >= 1 || p.alpha <= 0) p.aDir *= -1;
    if (p.y < -5) p.y = canvas.height + 5;
    if (p.x < -5) p.x = canvas.width + 5;
    if (p.x > canvas.width + 5) p.x = -5;
  });
  requestAnimationFrame(loop);
})();

/* ── Confetti ── */
const confettiSymbols = ['🎉','✨','💛','💖','🌟','🎊','❤️','🌸','⭐','💕'];
const box = document.getElementById('confettiBox');
const COUNT = 28;

for (let i = 0; i < COUNT; i++) {
  const el = document.createElement('div');
  el.className = 'confetti-piece';
  el.textContent = confettiSymbols[Math.floor(Math.random() * confettiSymbols.length)];
  el.style.left = Math.random() * 100 + 'vw';
  const dur = 5 + Math.random() * 7;
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = (Math.random() * 6) + 's';
  el.style.fontSize = (14 + Math.random() * 22) + 'px';
  box.appendChild(el);
}
</script>
</body>
</html>
